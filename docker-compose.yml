services:
  dashboard:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8069:8080"
    volumes:
      - sddb-data:/data
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-}
      # Reverse proxy settings; see "Security notes" in the README.
      - SDDB_TRUSTED_PROXIES=${SDDB_TRUSTED_PROXIES:-}
      - SDDB_TRUSTED_ORIGINS=${SDDB_TRUSTED_ORIGINS:-}

volumes:
  sddb-data:
